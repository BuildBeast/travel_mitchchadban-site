name: Zero-error dependency hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-error-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/zero-error-hardening
          fetch-depth: 0
      - name: Repair unmatched Barcelona prose wrapper
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/pages/best-day-trips-from-barcelona/index.astro';
          const text = fs.readFileSync(path, 'utf8');
          const needle = `        superb place that assumes a car and defeats anyone without one.\n      </p>\n\n    <Practical place="Catalonia — Excursions from Barcelona"`;
          const replacement = `        superb place that assumes a car and defeats anyone without one.\n      </p>\n    </div>\n\n    <Practical place="Catalonia — Excursions from Barcelona"`;
          const matches = text.split(needle).length - 1;
          if (matches !== 1) throw new Error(`Expected exactly one Barcelona wrapper repair target, found ${matches}`);
          fs.writeFileSync(path, text.replace(needle, replacement));
          NODE
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Upgrade vulnerable framework dependencies
        run: npm install astro@7.2.9 sharp@0.35.4 @astrojs/sitemap@latest
      - name: Apply non-breaking audit fixes
        run: npm audit fix
      - name: Audit full dependency tree
        run: npm audit --audit-level=high
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Astro type and content checks
        run: npm run check
      - name: Confirm div balance in Barcelona day-trips page
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/pages/best-day-trips-from-barcelona/index.astro';
          const text = fs.readFileSync(path, 'utf8');
          let balance = 0;
          for (const match of text.matchAll(/<\/?div\b[^>]*>/g)) balance += match[0].startsWith('</') ? -1 : 1;
          if (balance !== 0) throw new Error(`Unbalanced div count remains: ${balance}`);
          console.log('Barcelona day-trips div balance: 0');
          NODE
      - name: Build production site
        run: npm run build
      - name: Validate responsive image markup
        run: npm run images:responsive:markup
      - name: Commit validated hardening
        run: |
          if git diff --quiet; then
            echo 'No hardening changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/pages/best-day-trips-from-barcelona/index.astro
          git commit -m 'Harden dependencies and repair strict markup'
          git push origin HEAD:fix/zero-error-hardening
