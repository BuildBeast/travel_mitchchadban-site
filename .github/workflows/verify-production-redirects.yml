name: Verify production site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-site-audit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Wait for production deployment
        run: sleep 60
      - name: Verify canonical normalization redirects
        run: node scripts/verify-production-redirects.mjs
      - name: Audit production site
        run: node scripts/audit-production-site.mjs
