name: Verify production site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-site-audit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit full dependency tree
        run: npm audit --audit-level=high
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Astro type and content checks
        run: npm run check
      - name: Build production site
        run: npm run build
      - name: Validate responsive image markup
        run: npm run images:responsive:markup
      - name: Wait for production deployment
        run: sleep 60
      - name: Verify canonical normalization redirects
        run: node scripts/verify-production-redirects.mjs
      - name: Audit production site
        run: node scripts/audit-production-site.mjs
